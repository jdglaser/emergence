[project]
name = "emergence"
version = "0.1.0"
description = "Domain model for an emergent social survival simulation"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "pyright>=1.1.400"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
